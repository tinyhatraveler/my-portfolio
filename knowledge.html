<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Passions - Luca Hawes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- ===== SIDEBAR (same as homepage) ===== -->
  <div class="sidebar">
    <header>
      <h1>Luca Hawes</h1>
      <p>Designer</p>
      <p>Gamer</p>
      <p>Perfectionist</p>
    </header>
  </div>

  <!-- ===== MAIN CONTENT: two panels side by side ===== -->
  <div class="content knowledge-content">

    <!-- LEFT PANEL: title, description, search, list -->
    <div class="knowledge-list-panel">

      <a href="index.html" class="back-link">&lt; Back</a>

      <h1>Passions</h1>
      <p class="subtitle">A "short" list of things that I am passionate or just am knowledgeable about. It was going to be sorted but I didn't understand it and gave up</p>

      <input type="text" id="search" placeholder="Search...">

      <ul class="knowledge-list" id="knowledge-list">
        <!-- List items are generated automatically from the array in the script below -->
      </ul>

    </div>

    <!-- RIGHT PANEL: expanded description, updated by clicking a list item -->
    <div class="knowledge-detail-panel" id="knowledge-detail">
      <p>Select something from the list to read more about it.</p>
    </div>

  </div>

</div>

<script src="passions.js"></script>

</body>
</html>
